[project]
name = "homedocs"
version = "0.1.0"
description = "Document Digitization Pipeline with AI-powered OCR"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    "pdf2image>=1.16",
]
aws = [
    "boto3>=1.34",
]
ai = [
    "anthropic>=0.40",
    "numpy>=1.26",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.6",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]
all = ["homedocs[ocr,aws,ai,api,dev]"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
